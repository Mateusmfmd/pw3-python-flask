<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineClub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <header class="site-header">
        <a href="/" class="header-brand">
            <span class="header-icon">🎬</span>
            <span class="header-title">CineClub</span>
        </a>
        <p class="header-sub">Seu catálogo de filmes e séries</p>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-camera-reels-fill"></i> CineClub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-fill"></i> Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/filmes"><i class="bi bi-film"></i> Filmes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/series"><i class="bi bi-tv-fill"></i> Séries</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-plus-circle-fill"></i> Cadastrar
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="/cadfilme"><i class="bi bi-film"></i> Cadastrar Filme</a></li>
                            <li><a class="dropdown-item" href="/cadserie"><i class="bi bi-tv-fill"></i> Cadastrar Série</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
        <p><i class="bi bi-camera-reels"></i> &copy;  CineBox — Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
